# Development stack: PostgreSQL + API (CPU) + web UI.
#   docker compose up --build
# Models and LoRAs are read from ./storage on the host. See docs/gpu-docker.md for NVIDIA GPUs.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_DB: forge
      # Local development default only; override via a .env file for anything shared.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge-dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://forge:${POSTGRES_PASSWORD:-forge-dev}@db:5432/forge
      MODEL_DIRECTORY: /app/storage/models
      LORA_DIRECTORY: /app/storage/loras
      OUTPUT_DIRECTORY: /app/storage/outputs
      DATASET_DIRECTORY: /app/storage/datasets
      CAPTION_MODEL_DIRECTORY: /app/storage/captioners/florence-2-base
      TRAINING_DIRECTORY: /app/storage/training
      DEVICE: ${DEVICE:-auto}
      GENERATION_BACKEND: ${GENERATION_BACKEND:-diffusers}
      CAPTION_BACKEND: ${CAPTION_BACKEND:-florence}
      TRAINING_BACKEND: ${TRAINING_BACKEND:-diffusers}
      # Empty disables auth. Set API_TOKEN in a .env file (it is also baked into the web image).
      API_TOKEN: ${API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./storage/models:/app/storage/models
      - ./storage/loras:/app/storage/loras
      - ./storage/outputs:/app/storage/outputs
      - ./storage/datasets:/app/storage/datasets
      - ./storage/captioners:/app/storage/captioners
      - ./storage/training:/app/storage/training
    ports:
      # Localhost only: the API is not reachable from other machines on the network.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  db-data:
