[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai-studio"
version = "0.1.0"
description = "Self-hosted image generation studio for open-source diffusion models and LoRA adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Heavy ML stack kept optional so CI and mock-mode development don't need it.
ai = [
  "torch>=2.3",
  "diffusers>=0.30",
  "transformers>=4.41",
  "accelerate>=0.31",
  "peft>=0.11",
  "safetensors>=0.4.3",
]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["apps/api", "."]
include = ["forge_api*", "ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forge_api", "ai"]
mypy_path = "apps/api:."
plugins = []

[[tool.mypy.overrides]]
module = ["torch.*", "diffusers.*", "transformers.*", "psutil.*", "safetensors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["apps/api", "."]
addopts = "-q"
