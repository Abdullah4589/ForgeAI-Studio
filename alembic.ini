# Alembic CLI config. The app runs migrations itself on startup; use this for authoring:
#   alembic revision --autogenerate -m "describe change"
[alembic]
script_location = apps/api/migrations
prepend_sys_path = apps/api:.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
